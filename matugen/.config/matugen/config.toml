[config]
# Keep generated output in the live XDG config tree.
# The wallpaper scripts pass the selected image to matugen explicitly.

[templates]
waybar = { input_path = '~/.config/matugen/templates/waybar-colors.css', output_path = '~/.config/waybar/colors.css' }
quickshell_launcher = { input_path = '~/.config/matugen/templates/quickshell-colors.qml', output_path = '~/.config/quickshell/launcher/Colors.qml' }
quickshell_wallpaper = { input_path = '~/.config/matugen/templates/quickshell-colors.qml', output_path = '~/.config/quickshell/wallpaper/Colors.qml' }
hyprland = { input_path = '~/.config/matugen/templates/hyprland-colors.lua', output_path = '~/.config/hypr/config/colors.lua' }
